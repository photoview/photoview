type ScannerResult {
  finished: Boolean!
  success: Boolean!
  progress: Float
  message: String
}

enum ScannerJobStatus {
  RUNNING
  QUEUED
}

"A single album/sub-album currently running or queued in the scanner."
type ScannerQueueItem {
  album: Album!
  status: ScannerJobStatus!
}

extend type Query {
  """
  Snapshot of what the scanner is currently running or has queued.
  Admins see every job; other users only see jobs for albums they have
  at least read access to.
  """
  scannerQueueStatus: [ScannerQueueItem!]! @isAuthorized
}

extend type Mutation {
  "Scan all users for new media"
  scanAll: ScannerResult! @isAdmin

  "Scan a single user for new media"
  scanUser(userId: ID!): ScannerResult! @isAdmin

  """
  Recursively scan a single album and its sub-albums for new media, without
  scanning the rest of the library. Caller must be an admin, or hold at
  least UPLOAD-level access on albumId.
  """
  scanAlbum(albumId: ID!): ScannerResult! @isAuthorized

  """
  Set how often, in seconds, the server should automatically scan for new media,
  a value of 0 will disable periodic scans
  """
  setPeriodicScanInterval(interval: Int!): Int! @isAdmin

  "Set max number of concurrent scanner jobs running at once"
  setScannerConcurrentWorkers(workers: Int!): Int! @isAdmin
}
